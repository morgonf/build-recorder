# Probe for the CI integration: does the tracer work on a stock docker
# executor, with no extra capabilities and the default seccomp profile?
# Users of a future brec template will run it on runners they do not
# control, so the answer has to come from such a runner, not from one
# configured to make it pass.  If this job fails, privileges are added one
# at a time and the minimum set goes into the template's instructions.

stages:
  - probe
  - collect
  - release

ptrace-probe:
  stage: probe
  image: registry.altlinux.org/alt/alt:p11
  tags: [brec]
  script:
    - apt-get update -q
    - apt-get install -y -q gcc make autoconf automake xxd libssl-devel python3
    # What the job runs under: these decide whether ptrace is allowed at all.
    - grep -E '^(CapEff|Seccomp|NoNewPrivs)' /proc/self/status
    - cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo "yama absent"
    - uname -r
    - autoreconf -i
    - ./configure
    - make -C src
    - ./build-recorder -o smoke.out gcc -c examples/f1.c -o f1.o
    - gcc -o threads examples/threads.c -lpthread
    - printf 'input line\n' > threads-input.txt
    - ./build-recorder -o threads.out ./threads
    - |
      python3 - <<'PY'
      from pathlib import Path
      from brec.model import parse_out

      g = parse_out(Path("smoke.out"))
      assert g.procs and g.files, "smoke trace recorded nothing"

      g = parse_out(Path("threads.out"))
      def paths(uris):
          return {g.files[u].abspath for u in uris if u in g.files}

      holders = [p for p in g.procs.values()
                 if any(a.endswith("threads-input.txt") for a in paths(p.reads))
                 and any(a.endswith("threads-output.o") for a in paths(p.writes))]
      assert holders, "the thread's read and write are on different subjects"
      print(f"ok: {len(g.procs)} process node(s), thread attribution holds")
      PY
  artifacts:
    when: always
    paths:
      - smoke.out
      - threads.out
    expire_in: 1 week

# brec-collect as a user would get it: installed by `make install`, then run
# around a build.  One rpm image and one dpkg image, because the package
# database dump is the part that differs between them.
.collect:
  stage: collect
  tags: [brec]
  needs: []
  script:
    - autoreconf -i
    - ./configure
    - make -C src install-binPROGRAMS
    - make install-binSCRIPTS
    - sh tests/collect-smoke.sh

collect-alt:
  extends: .collect
  image: registry.altlinux.org/alt/alt:p11
  before_script:
    - apt-get update -q
    - apt-get install -y -q gcc make autoconf automake xxd libssl-devel python3

# 24.04, not 22.04: the xxd in 22.04 has no -n, which src/Makefile.am needs
# to embed the schema, so the tracer does not build there.
collect-ubuntu:
  extends: .collect
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -q
    - apt-get install -y -q gcc make autoconf automake xxd libssl-dev python3 zlib1g-dev golang-go

# ── Release: what templates/brec.yml downloads ───────────────────────────────
# On a v* tag: a static build-recorder (so it runs in any glibc or musl image
# a consuming project builds in), brec-collect, the brec package and their
# checksums, into this project's generic package registry under the version.
# The three version strings must agree with the tag, or the component would
# fetch binaries built from some other commit.
release:
  stage: release
  image: registry.altlinux.org/alt/alt:p11
  tags: [brec]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - apt-get update -q
    - apt-get install -y -q gcc make autoconf automake xxd libssl-devel glibc-devel-static libssl-devel-static zlib-devel-static curl file
    - ver=${CI_COMMIT_TAG#v}
    - |
      grep -q "^AC_INIT(\[Build Recorder\], \[$ver\])" configure.ac || { echo "configure.ac does not say $ver"; exit 1; }
      grep -q "^      default: $ver\$" templates/brec.yml || { echo "templates/brec.yml does not default to $ver"; exit 1; }
      grep -q "^version = \"$(echo "$ver" | sed 's/-//')\"" pyproject.toml || { echo "pyproject.toml does not say $ver"; exit 1; }
    - autoreconf -i
    - ./configure
    # OpenSSL's static archive pulls in zlib for its compression code.
    - make -C src LDFLAGS=-static LIBS="-lcrypto -lz"
    - strip build-recorder
    - file build-recorder | grep -q 'statically linked'
    - ./build-recorder -o /dev/null true
    - mkdir dist
    - cp build-recorder scripts/brec-collect dist/
    - tar --exclude=__pycache__ -czf "dist/brec-$ver.tar.gz" pyproject.toml brec
    - (cd dist && sha256sum build-recorder brec-collect "brec-$ver.tar.gz" > SHA256SUMS && cat SHA256SUMS)
    - |
      for f in dist/*; do
          curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
              "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/brec/$ver/$(basename "$f")"
          echo
      done
  artifacts:
    paths:
      - dist/
