services:
  build-record:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${OUTPUT_DIR:?set OUTPUT_DIR to the host directory for results}:/output
      # SRPM mode only:
      - ${SRPM_DIR:-/dev/null}:/srpms:ro
    environment:
      - OUTPUT_DIR=/output
      # Git mode:
      - GIT_URL=${GIT_URL:-}
      - GIT_REF=${GIT_REF:-}
      - GIT_BUILD_CMD=${GIT_BUILD_CMD:-}
      # SRPM mode:
      - SRPM=${SRPM:-}
