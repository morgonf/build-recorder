services:
  build-record:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${SRPM_DIR:?set SRPM_DIR to the directory containing the .src.rpm}:/srpms:ro
      - ${OUTPUT_DIR:?set OUTPUT_DIR to the host directory for results}:/output
    environment:
      - SRPM=/srpms/${SRPM_FILE:?set SRPM_FILE to the .src.rpm filename}
      - OUTPUT_DIR=/output
