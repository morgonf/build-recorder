[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brec"
version = "0.1.0"
description = "Analysis layer for build-recorder traces"
requires-python = ">=3.9"

[project.scripts]
brec = "brec.cli:main"

[tool.setuptools]
packages = ["brec", "brec.commands", "brec.provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
