name: CI

# Guards two things that used to be checked only by hand: that the tracer still
# builds and still records a real build, and that the Python analysis layer
# (333 tests) stays green.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          # vim-common provides xxd, used to embed the RDF schema into the
          # binary; benchmark/Makefile.am refuses to parse without /usr/bin/time
          sudo apt-get install -y -q autoconf automake libssl-dev vim-common time

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Build the tracer
        run: |
          autoreconf -i
          ./configure
          make

      - name: Python test suite
        run: python -m pytest tests -q

      - name: Trace a real compilation (end-to-end)
        run: |
          ./build-recorder -o smoke.out gcc -c examples/f1.c -o f1.o
          python - <<'PY'
          from pathlib import Path
          from brec.model import parse_out

          g = parse_out(Path("smoke.out"))
          assert g.procs, "no process nodes recorded"
          assert g.files, "no file nodes recorded"

          reads = {g.files[u].abspath for p in g.procs.values() for u in p.reads if u in g.files}
          writes = {g.files[u].abspath for p in g.procs.values() for u in p.writes if u in g.files}
          assert any(a.endswith("examples/f1.c") for a in reads), f"source not read: {sorted(reads)[:20]}"
          assert any(a.endswith("f1.o") for a in writes), f"object not written: {sorted(writes)[:20]}"
          print(f"ok: {len(g.procs)} processes, {len(g.files)} files")
          PY

      - name: Trace a hardlink (A1 regression)
        run: |
          # A prebuilt object entering a tree through ln(1) has no open, read or
          # write to observe; if the link edge is lost, the verdict layer goes
          # blind to that path.
          printf 'prebuilt\n' > prebuilt.o
          ./build-recorder -o link.out /bin/ln -f prebuilt.o copied.o
          grep -q 'b:hardlink-from' link.out || { echo "hardlink edge missing"; cat link.out; exit 1; }
          grep -q 'b:hardlink-to' link.out

      - name: Verdict with payload closure on the traced build
        run: |
          # Unenriched, so system libraries carry no package attribution: this
          # step proves the analysis runs end to end on a real trace and that
          # the shipped object matches an observed build output, rather than
          # asserting a colour. 0 GREEN, 1 RED, 3 GREY are all verdicts; 2 is
          # a usage error and must fail the job.
          mkdir -p payload && cp f1.o payload/
          set +e
          python3 provenance-verdict.py smoke.out --payload payload --json verdict.json
          rc=$?
          set -e
          case $rc in 0|1|3) ;; *) echo "verdict failed with $rc"; exit 1 ;; esac
          python -c "
          import json; r = json.load(open('verdict.json'))
          p = r['payload']
          assert p['total'] == 1, p
          assert p['green'] == 1, r['payload_findings']
          print('payload closure ok:', p)"
